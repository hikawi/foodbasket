[package]
name = "foodbasket"
version = "0.0.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
axum = { version = "0.8.9", features = ["json", "query", "ws"] }
axum-test = "21.1.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
fred = { version = "10.1.0", features = ["serde-json", "mocks"] }
http = "1.5.0"
mockall = "0.15.0"
password-hash = "0.6.1"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "chrono",
  "uuid",
  "migrate",
] }
testcontainers = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
